<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="cartao">
        <h1>Entrar</h1>
        <p class="modo" id="modo"></p>

        <form id="loginForm">
            <label for="login">Login</label>
            <input type="text" id="login" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>

        <p id="mensagem" role="status"></p>

        <p class="dica">Usuários de teste: <code>ana / 123</code> e <code>carlos / 456</code></p>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
